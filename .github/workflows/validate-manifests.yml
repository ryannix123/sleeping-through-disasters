# Validates the pattern before Argo CD ever sees it.
#
# In a GitOps repo the manifests ARE the deployment, so a typo here is an
# outage on the passive site that nobody notices until failover. This
# workflow renders the pattern exactly as the Validated Patterns operator
# will — the clustergroup chart for each site, then every pattern chart with
# its full values stack — and checks the DR invariants on the result.
name: Validate pattern

on:
  push:
    branches: [main, validated-pattern]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render the clustergroup chart for both sites
        run: |
          set -euo pipefail
          helm repo add vp https://charts.validatedpatterns.io
          version=$(yq '.main.multiSourceConfig.clusterGroupChartVersion' values-global.yaml)
          helm pull vp/clustergroup --version "$version" --untar --untardir /tmp/vp
          for site in hub active; do
            helm template "$site" /tmp/vp/clustergroup -f values-global.yaml -f "values-$site.yaml" \
              --set global.repoURL="https://github.com/${GITHUB_REPOSITORY}.git" \
              --set global.targetRevision="${GITHUB_REF_NAME}" \
              --set global.clusterPlatform=AWS --set global.clusterVersion=4.20 \
              --set global.localClusterDomain=apps.example.com \
              --set global.hubClusterDomain=apps.hub.example.com \
              --set global.multiSourceRepoUrl=https://charts.validatedpatterns.io \
              --set global.vpArgoNamespace=openshift-gitops > "/tmp/clustergroup-$site.yaml"
            echo "ok   clustergroup/$site ($(grep -c '^kind: Application$' "/tmp/clustergroup-$site.yaml") Applications)"
          done

      - name: Render every pattern chart with its full values stack
        run: tests/dr/render.sh /tmp/rendered

      - name: Check DR invariants
        run: python3 tests/dr/invariants.py /tmp/rendered
