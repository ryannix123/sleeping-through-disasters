---
# ServiceAccount the failover Pipeline runs as. Scoped to the odoo namespace:
# it can promote the CNPG cluster, scale the Odoo Deployment, and exec into
# the database pod for the WAL witness. Nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]   # poller state
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]      # the poller creates PipelineRuns
  # restore-filestore: rebuild the app PVC from VolSync's latest snapshot
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["volsync.backube"]
    resources: ["replicationdestinations"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]                        # promote: read odoo-db-app to sync the role password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
subjects:
  - kind: ServiceAccount
    name: dr-failover
    namespace: odoo
roleRef:
  kind: Role
  name: dr-failover
  apiGroup: rbac.authorization.k8s.io
---
# The EventListener runs as the same ServiceAccount and needs Tekton Triggers'
# standard roles to read Triggers/Bindings/Templates and create PipelineRuns.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-failover-eventlistener
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
subjects:
  - kind: ServiceAccount
    name: dr-failover
    namespace: odoo
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-failover-eventlistener-odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
subjects:
  - kind: ServiceAccount
    name: dr-failover
    namespace: odoo
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
---
# Failover mode (dr-suspend-gitops) patches the passive-site Argo Applications,
# which live on this cluster (the hub) in openshift-gitops.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-failover-argo
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-failover-argo
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
subjects:
  - kind: ServiceAccount
    name: dr-failover
    namespace: odoo
roleRef:
  kind: Role
  name: dr-failover-argo
  apiGroup: rbac.authorization.k8s.io
