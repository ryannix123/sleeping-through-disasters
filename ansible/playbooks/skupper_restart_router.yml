---
# Included by 05-interconnect-link.yml (directly, and via
# skupper_restart_controller.yml) — roll the Skupper router in the site
# namespace and wait for the new pod to be serving.
#
# Why this exists: the router loads its TLS certificate (skupper-site-server)
# once, at start. When the controller re-issues that certificate — after a
# reboot, an upgrade, or a controller restart — the running router keeps
# presenting the OLD one, and the peer site's router refuses it with
# "SSL certificate verify failed". The Link reports Not Operational and the
# Sites never see each other. A rollout restart makes the router load the
# current certificate. Seen on 2026-10-06 after a homelab upgrade (RHSI
# 2.2.2-rh-1); `oc rollout restart deploy/skupper-router` cleared it.
#
# Expects: kubeconfig, skupper_namespace. Optional: skupper_router_deployment.

- name: Roll the Skupper router so it serves its current certificate
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    merge_type: merge
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ skupper_router_deployment | default('skupper-router') }}"
        namespace: "{{ skupper_namespace }}"
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).isoformat() }}"
    wait: true
    wait_timeout: 300
