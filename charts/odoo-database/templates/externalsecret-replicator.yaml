---
# The "replicator" role's credentials. CloudNativePG creates the role from
# this Secret when the primary bootstraps, and the passive replica logs in
# with it — so it must exist before the Cluster (sync-wave -1; Argo CD waits
# for the ExternalSecret to be healthy before moving on).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-replicator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.replicatorSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: odoo-replicator
    template:
      type: kubernetes.io/basic-auth
      data:
        username: replicator
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.replicatorSecret.key }}
        property: password
