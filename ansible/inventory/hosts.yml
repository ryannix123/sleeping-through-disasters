---
# Every play runs locally and talks to a cluster through its kubeconfig,
# so all hosts are ansible_connection=local. The kubeconfig var is what
# actually selects the cluster.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    # The ACM / GitOps management cluster.
    hub:
      hosts:
        hub-cluster:
          kubeconfig: "~/.kube/hub.config"

    # The two clusters the pattern deploys to.
    managed:
      hosts:
        active:
          kubeconfig: "~/.kube/active.config"
          cluster_role: active
          # Short name ACM will use for this ManagedCluster.
          managed_cluster_name: odoo-active
        passive:
          kubeconfig: "~/.kube/passive.config"
          cluster_role: passive
          managed_cluster_name: odoo-passive
