---
# ── Non-secret configuration ────────────────────────────────────────────────
# Secrets live in vault.yml (encrypted). See README.md.

# Namespaces
odoo_namespace: odoo
clusterset_name: odoo-dr

# Git repo the ApplicationSets pull from. Change to your fork.
gitops_repo_url: "https://github.com/ryannix123/sleeping-through-disasters.git"
gitops_repo_revision: main

# Operator channels. Pin these deliberately.
acm_channel: release-2.12
gitops_channel: latest

# Object storage for VolSync. The bucket and region are not secret;
# nothing to set — the rsync-tls key is generated by VolSync.
# (unused with rsync-tls) volsync_s3_endpoint: "s3.amazonaws.com"
# (unused with rsync-tls) volsync_s3_bucket: "odoo-dr-backups"
# (unused with rsync-tls) volsync_s3_region: "us-east-1"
# (unused with rsync-tls) volsync_restic_path: "odoo-filestore"

# ── VolSync ─────────────────────────────────────────────────────────────────
# Filestore replication is rsync-tls PVC-to-PVC over the Skupper VAN — no object
# storage. The rsync-tls pre-shared key is generated by the destination and
# copied to the source by playbooks/05-interconnect-link.yml. Nothing to set.

# ── Cloudflare ──────────────────────────────────────────────────────────────
cloudflare_hostname: "odoo.example.com"
cloudflare_monitor_path: "/web/health"
cloudflare_monitor_interval: 60      # seconds between health checks
cloudflare_monitor_retries: 2        # retries before a pool is marked down
cloudflare_lb_ttl: 30                # keep low; DNS TTL dominates real RTO

# ── Waits ───────────────────────────────────────────────────────────────────
operator_wait_retries: 60
operator_wait_delay: 15
replication_lag_threshold_seconds: 60

# ACM policy namespace (where Policies + PlacementBindings live on the hub)
acm_policy_namespace: odoo-dr-acm
