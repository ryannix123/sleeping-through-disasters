---
# Hub-only deployment. Every play targets the ACM hub; ACM + Argo CD distribute
# to production (active) and local-cluster (passive).
#
# Prereqs:
#   - Logged into the hub (oc whoami --show-server → the hub API)
#   - Both clusters imported + labeled in ACM (role, clusterset) and Ready
#   - playbooks/00-generate-secrets.yml has been run and the vault filled in
#
#   ansible-playbook site.yml

- ansible.builtin.import_playbook: playbooks/00-preflight.yml
- ansible.builtin.import_playbook: playbooks/01-hub-operators.yml
- ansible.builtin.import_playbook: playbooks/02-verify-clusters.yml
- ansible.builtin.import_playbook: playbooks/03-deploy-gitops.yml
- ansible.builtin.import_playbook: playbooks/04-secrets.yml
- ansible.builtin.import_playbook: playbooks/05-interconnect-link.yml
- ansible.builtin.import_playbook: playbooks/06-cloudflare.yml
- ansible.builtin.import_playbook: playbooks/99-verify.yml
