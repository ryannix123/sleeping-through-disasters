---
# Generates the pattern's secrets ONCE and writes them to an encrypted
# Ansible Vault file. Re-running is safe: if vault.yml already exists it
# refuses to touch it, so passwords never rotate by accident.
#
#   ansible-playbook playbooks/00-generate-secrets.yml
#
# Cloudflare values cannot be generated — the playbook leaves placeholders
# and tells you to edit them in.
- name: Generate secrets and seal them in Ansible Vault
  hosts: localhost
  gather_facts: false

  vars:
    vault_file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
    vault_pass_file: "{{ playbook_dir }}/../.vault-pass"

  tasks:
    - name: Check whether the vault already exists
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: vault_stat

    - name: Stop if the vault already exists
      ansible.builtin.debug:
        msg: >-
          {{ vault_file }} already exists — leaving it alone.
          Delete it deliberately if you intend to rotate every secret.
      when: vault_stat.stat.exists

    - name: Create the secrets
      when: not vault_stat.stat.exists
      block:

        - name: Ensure a vault password file exists
          ansible.builtin.copy:
            content: "{{ lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }}\n"
            dest: "{{ vault_pass_file }}"
            mode: "0600"
            force: false

        - name: Write the unencrypted vault
          ansible.builtin.copy:
            dest: "{{ vault_file }}"
            mode: "0600"
            content: |
              ---
              # Generated by playbooks/00-generate-secrets.yml
              # Encrypted with Ansible Vault. Do not commit the plaintext.

              vault_odoo_admin_password: "{{ lookup('password', '/dev/null length=28 chars=ascii_letters,digits') }}"
              vault_odoo_login_password: "{{ lookup('password', '/dev/null length=28 chars=ascii_letters,digits') }}"
              vault_pg_replicator_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

              vault_volsync_s3_access_key: "REPLACE-ME"
              vault_volsync_s3_secret_key: "REPLACE-ME"
              vault_volsync_restic_password: "{{ lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }}"

              vault_cloudflare_api_token: "REPLACE-ME"
              vault_cloudflare_account_id: "REPLACE-ME"
              vault_cloudflare_zone_id: "REPLACE-ME"

        - name: Encrypt the vault
          ansible.builtin.command:
            cmd: >-
              ansible-vault encrypt {{ vault_file }}
              --vault-password-file {{ vault_pass_file }}
          changed_when: true

        - name: Tell the operator what is left to do
          ansible.builtin.debug:
            msg:
              - "Vault created and encrypted: {{ vault_file }}"
              - "Vault password: {{ vault_pass_file }} (mode 0600, git-ignored — back this up)"
              - ""
              - "Passwords were generated for Odoo and PostgreSQL replication."
              - "You must still fill in the S3 and Cloudflare values:"
              - "  ansible-vault edit {{ vault_file }}"
              - ""
              - "RESTIC_PASSWORD was generated. If you lose it, the backups are unreadable."
