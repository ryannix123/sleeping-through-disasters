---
# Primary target is the HUB. ACM + Argo CD distribute to the managed clusters,
# so almost every play is hub-only and uses your current oc login.
#
# The two managed clusters appear here as well, but they are used by ONE play:
# 05-interconnect-link.yml, where the Skupper v2 collection performs the token
# handshake directly against each site (the dev-endorsed path). Everything else
# ignores them.
#
# The two kubeconfigs MUST be single-context files (never a copy of
# ~/.kube/config): a file with many contexts and a movable current-context
# will silently send commands to the wrong cluster. Create each with oc login,
# then strip it to one context:
#   KUBECONFIG=~/.kube/hub.config    oc login --token=... --server=https://<hub-api>:6443
#   KUBECONFIG=~/.kube/hub.config    oc config view --minify --flatten > /tmp/h && mv /tmp/h ~/.kube/hub.config
#   KUBECONFIG=~/.kube/active.config oc login --token=... --server=https://<homelab-api>:6443
#   KUBECONFIG=~/.kube/active.config oc config view --minify --flatten > /tmp/a && mv /tmp/a ~/.kube/active.config
# (passive == the hub cluster / local-cluster in this demo topology)
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  hosts:
    hub:
      # Pinned on purpose. Your shell's default oc context is irrelevant.
      kubeconfig: "~/.kube/hub.config"
      # Names EXACTLY as they appear in ACM → Clusters (Name column).
      active_cluster_name: active
      passive_cluster_name: local-cluster

  children:
    # Used only by 05-interconnect-link.yml.
    van_sites:
      hosts:
        active_site:
          kubeconfig: "~/.kube/active.config"     # homelab SNO (issues the token)
          skupper_namespace: odoo
        passive_site:
          kubeconfig: "~/.kube/hub.config"        # AWS SNO / local-cluster == the hub cluster (redeems it)
          skupper_namespace: odoo
