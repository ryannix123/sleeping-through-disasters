---
# Odoo filestore PVC (attachments + sessions). Mounted at /var/lib/odoo,
# which is Odoo's data_dir in the odoo-on-openshift image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: app
spec:
  selector:
    app: odoo
  ports:
    - name: http
      port: 8069
      targetPort: 8069
    - name: longpoll
      port: 8072
      targetPort: 8072
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: app
  annotations:
    haproxy.router.openshift.io/timeout: "600s"
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: odoo
  port:
    targetPort: http
---
# ACTIVE: serving traffic. replicas is 1 because the filestore PVC is ReadWriteOnce and Odoo pods cannot share it. Scaling out requires RWX or attachments-in-database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: app
  annotations:
    app.openshift.io/runtime: python
    app.openshift.io/connects-to: '[{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","name":"odoo-db"}]'
spec:
  replicas: 1
  # Recreate because the filestore PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
        app.kubernetes.io/part-of: odoo-dr
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: odoo
          image: quay.io/ryan_nix/odoo-openshift-dr:19.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8069
            - name: longpoll
              containerPort: 8072
          env:
            # Always the read-write service. After promotion the name is
            # unchanged, so no application reconfiguration is needed.
            - name: DB_HOST
              value: odoo-db-rw
            - name: DB_PORT
              value: "5432"
            # Credentials are generated by CNPG into <cluster>-app.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: dbname
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-admin
                  key: admin-password
            - name: ADMIN_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-admin
                  key: login-password
            # Load Odoo's built-in demo data (customers, quotations, invoices,
            # products) so the instance looks like a real business on day one.
            # "False" means "do NOT run without demo" — i.e. demo data loads.
            # This runs ONLY on first init of the active database; the passive
            # site is a replica and never initialises its own data.
            - name: WITHOUT_DEMO
              value: "False"
            # Install the functional modules whose demo data is worth showing.
            # base alone carries almost none; these give a populated CRM/sales
            # instance. Trim or extend to taste.
            - name: INITIAL_MODULES
              value: "base,contacts,sale_management,account,stock"
            # Threaded mode. Raising this requires the longpolling route and
            # a ReadWriteMany filestore (see docs/ARCHITECTURE.md).
            - name: WORKERS
              value: "0"
            - name: LIST_DB
              value: "False"
            # "file" keeps attachments on the VolSync-replicated PVC.
            # "db" stores them in PostgreSQL so they share the database's
            # replication stream — RPO 0 for attachments. See ARCHITECTURE.md.
            - name: ATTACHMENT_LOCATION
              value: "file"
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odoo-data
