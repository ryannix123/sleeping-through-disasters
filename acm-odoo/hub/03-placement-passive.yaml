---
# Placement that selects clusters labeled role=passive in the odoo-dr ClusterSet.
# Used by ApplicationSets that should only deploy to the passive (DR) cluster.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: odoo-passive
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  clusterSets:
    - odoo-dr
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            role: passive
