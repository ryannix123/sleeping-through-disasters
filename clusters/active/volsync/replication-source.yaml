---
# Filestore replication SOURCE (active site), using rsync-tls over the VAN.
#
# PVC-to-PVC, no object storage. Pushes the Odoo filestore to the passive
# cluster's ReplicationDestination every 2 minutes. The destination is reached
# at "odoo-volsync-dest" — a local Service published by a Skupper Listener that
# tunnels to the passive cluster (mirrors how the database primary is reached).
#
# CONSISTENCY NOTE (unchanged): the database replicates in seconds; this volume
# every 2 minutes, so a failover can briefly reference attachments not yet
# copied. See docs/ARCHITECTURE.md. Set ATTACHMENT_LOCATION=db to remove the
# window entirely.
#
# RPO FLOOR (unchanged): VolSync does not stack jobs. If a sync runs longer than
# the interval, the effective RPO becomes the sync duration. Watch
# .status.lastSyncDuration.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: odoo-data
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: volsync
spec:
  sourcePVC: odoo-data
  trigger:
    schedule: "*/2 * * * *"
  rsyncTLS:
    copyMethod: Snapshot
    # The passive destination, reached across the VAN. The key Secret that
    # rsync-tls uses for mutual auth is generated by the destination as
    # "volsync-rsync-tls-odoo-data" and must be copied to this cluster (the
    # bootstrap runbook / Ansible handles it, like the Skupper token).
    keySecret: volsync-rsync-tls-dst-odoo-data
    address: odoo-volsync-dest
