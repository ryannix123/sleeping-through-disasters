---
# Verify the DR posture entirely from the hub.
#
# Rather than exec into pods on each managed cluster, this reads state that ACM
# already surfaces on the hub: the Policy compliance for operators and standby
# mode, and ManagedClusterView snapshots of the two CNPG Clusters. Hub-only.
- name: Verify the pattern from the hub
  hosts: hub
  gather_facts: false

  tasks:
    - name: Check ACM policies are compliant
      kubernetes.core.k8s_info:
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        namespace: "{{ acm_policy_namespace }}"
      register: policies

    - name: Report policy compliance
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}: {{ item.status.compliant | default('unknown') }}
      loop: "{{ policies.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: View the active CNPG cluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: view.open-cluster-management.io/v1beta1
          kind: ManagedClusterView
          metadata:
            name: cnpg-active
            namespace: "{{ active_cluster_name }}"
          spec:
            scope:
              apiGroup: postgresql.cnpg.io
              version: v1
              kind: Cluster
              name: odoo-db
              namespace: "{{ odoo_namespace }}"

    - name: Read the active cluster status
      kubernetes.core.k8s_info:
        api_version: view.open-cluster-management.io/v1beta1
        kind: ManagedClusterView
        name: cnpg-active
        namespace: "{{ active_cluster_name }}"
      register: active_view
      retries: 12
      delay: 10
      until: active_view.resources[0].status.result.status is defined

    - name: Assert the active database is healthy
      ansible.builtin.assert:
        that:
          - active_view.resources[0].status.result.status.readyInstances | default(0) | int >= 1
        fail_msg: "Active CNPG cluster is not reporting ready instances."
        success_msg: >-
          Active DB ready instances:
          {{ active_view.resources[0].status.result.status.readyInstances | default(0) }}

    - name: View the passive CNPG cluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: view.open-cluster-management.io/v1beta1
          kind: ManagedClusterView
          metadata:
            name: cnpg-passive
            namespace: "{{ passive_cluster_name }}"
          spec:
            scope:
              apiGroup: postgresql.cnpg.io
              version: v1
              kind: Cluster
              name: odoo-db
              namespace: "{{ odoo_namespace }}"

    - name: Read the passive cluster status
      kubernetes.core.k8s_info:
        api_version: view.open-cluster-management.io/v1beta1
        kind: ManagedClusterView
        name: cnpg-passive
        namespace: "{{ passive_cluster_name }}"
      register: passive_view
      retries: 12
      delay: 10
      until: passive_view.resources[0].status.result.spec is defined

    - name: Assert the passive database is a replica
      ansible.builtin.assert:
        that:
          - passive_view.resources[0].status.result.spec.replica.enabled | default(false) | bool
        fail_msg: >-
          Passive CNPG cluster is NOT in replica mode. If this was not a
          deliberate promotion, investigate split-brain risk.
        success_msg: "Passive DB is in replica mode — correct."

    - name: Clean up the views
      kubernetes.core.k8s:
        state: absent
        definition:
          apiVersion: view.open-cluster-management.io/v1beta1
          kind: ManagedClusterView
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.ns }}"
      loop:
        - { name: cnpg-active,  ns: "{{ active_cluster_name }}" }
        - { name: cnpg-passive, ns: "{{ passive_cluster_name }}" }
      loop_control:
        label: "{{ item.name }}"
