---
# psk.txt in stunnel's format: <id>:<at least 32 hex digits>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.pskSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.pskSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: {{ .Values.pskSecret.name }}
    template:
      type: Opaque
      data:
        psk.txt: "{{ `1:{{ .psk }}` }}"
  data:
    - secretKey: psk
      remoteRef:
        key: {{ .Values.pskSecret.key }}
        property: psk
