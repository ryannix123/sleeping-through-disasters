[options]
; This file is a build-time placeholder. The entrypoint regenerates it at
; startup from environment variables so the image stays credential-free.
admin_passwd = admin
db_host = postgresql
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
addons_path = /opt/odoo/src/addons,/opt/odoo/src/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
list_db = False
proxy_mode = True
workers = 0
