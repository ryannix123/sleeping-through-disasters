---
# Phase 5 — establish the Service Interconnect (Skupper v2) link, then copy
# the VolSync rsync-tls key. The ONE play that talks to both managed clusters
# directly; everything else goes through the hub.
#
# Design notes (learned the hard way — see docs/DESIGN-DECISIONS.md):
#   * No skupper.v2 collection. It shells out to the CLI, hung on a Pending
#     grant with no timeout, and once flipped a kubeconfig's current-context.
#     This play uses only kubernetes.core, with the kubeconfig pinned on every
#     task, and does exactly what a successful manual handshake does:
#       active:  AccessGrant  -> wait Ready -> read url / code / ca
#       passive: AccessToken(url, code, ca) -> Link forms -> both Sites see 2
#   * Idempotent. If the passive Site already sees 2 sites in the network, the
#     handshake is skipped. Safe to re-run after a reboot to re-link.
#   * It issues its OWN grant (odoo-link-grant) rather than consuming the
#     Argo-managed one, so a re-run never fights GitOps and a spent grant is
#     simply replaced.
#   * Every wait has a bounded retry, and a failure names the object to check.
#   * The Skupper controller on the active site wedges after a reboot (its
#     Site never goes Ready, or its grant server never issues). When either
#     wait runs out, the play restarts the controller once and waits again
#     (skupper_restart_controller.yml) before failing. That also rolls the
#     router, which only reads its TLS certificate at start.
#   * Before redeeming, it deletes any leftover AccessToken, Link AND link
#     Secret on the passive. A stale Secret silently spends the new grant.
#   * If the token redeems but the sites still don't link, it rolls the
#     active router once (stale certificate) and waits again.

# ─────────────────────────────────────────────────────────────────────────────
- name: Check whether the VAN link already exists
  hosts: passive_site
  gather_facts: false
  tasks:
    - name: Read the passive Site
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "{{ skupper_namespace }}"
      register: passive_site_obj

    - name: Decide whether a handshake is needed
      ansible.builtin.set_fact:
        link_needed: >-
          {{ not (passive_site_obj.resources | length > 0
                  and (passive_site_obj.resources[0].status.sitesInNetwork | default(0) | int) >= 2) }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ 'VAN already linked (passive Site sees ' ~
             (passive_site_obj.resources[0].status.sitesInNetwork | default(0)) ~
             ' sites) — skipping the handshake.'
             if not link_needed else
             'No VAN link yet — issuing a grant on active and redeeming it on passive.' }}

# ─────────────────────────────────────────────────────────────────────────────
- name: Issue an access grant on the active site
  hosts: active_site
  gather_facts: false
  tasks:
    - name: Skip if the link already exists
      ansible.builtin.meta: end_play
      when: not hostvars['passive_site'].link_needed | bool

    # Give the Site two minutes on its own. If it is not Ready by then, the
    # controller has almost certainly wedged (it has, every time): restart it
    # once and wait again before failing.
    - name: Wait for the active Site to be Ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "{{ skupper_namespace }}"
      register: active_site_obj
      retries: 12
      delay: 10
      until: >-
        active_site_obj.resources | length > 0 and
        (active_site_obj.resources[0].status.status | default('')) == 'Ready'
      failed_when: false

    - name: Restart the Skupper controller if the Site never came Ready
      ansible.builtin.include_tasks: skupper_restart_controller.yml
      when: >-
        not (active_site_obj.resources | length > 0 and
             (active_site_obj.resources[0].status.status | default('')) == 'Ready')

    - name: Wait for the active Site to be Ready (after the restart)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "{{ skupper_namespace }}"
      register: active_site_retry
      retries: 18
      delay: 10
      until: >-
        active_site_retry.resources | length > 0 and
        (active_site_retry.resources[0].status.status | default('')) == 'Ready'
      failed_when: false
      when: >-
        not (active_site_obj.resources | length > 0 and
             (active_site_obj.resources[0].status.status | default('')) == 'Ready')

    - name: Settle on the latest Site reading
      ansible.builtin.set_fact:
        active_site_final: >-
          {{ active_site_retry if (active_site_retry is defined and active_site_retry is not skipped)
             else active_site_obj }}

    - name: Fail with a useful message if the Site never came Ready
      ansible.builtin.assert:
        that:
          - active_site_final.resources | length > 0
          - (active_site_final.resources[0].status.status | default('')) == 'Ready'
        fail_msg: >-
          The active Site in {{ skupper_namespace }} is not Ready, even after
          restarting the Skupper controller. Check:
          oc get site.skupper.io -n {{ skupper_namespace }} -o yaml;
          oc logs -n openshift-operators deploy/skupper-controller --tail=50.

    # A wedged controller also under-reports the network. If, once healthy,
    # the active Site already sees both sites, the link was fine all along —
    # do not tear it down and redo the handshake.
    - name: Stop if the link turns out to be up already
      ansible.builtin.set_fact:
        link_now_up: >-
          {{ (active_site_final.resources[0].status.sitesInNetwork | default(0) | int) >= 2 }}

    - name: Report a link that was up all along
      ansible.builtin.debug:
        msg: "Active Site sees {{ active_site_final.resources[0].status.sitesInNetwork }} sites — the VAN is already linked. Skipping the handshake."
      when: link_now_up | bool

    - name: End the handshake here
      ansible.builtin.meta: end_play
      when: link_now_up | bool

    # Replace any previous grant of ours so a re-run never hits a spent one.
    - name: Remove a previous grant from an earlier run
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: skupper.io/v2alpha1
        kind: AccessGrant
        name: odoo-link-grant
        namespace: "{{ skupper_namespace }}"

    - name: Issue a single-use grant
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: skupper.io/v2alpha1
          kind: AccessGrant
          metadata:
            name: odoo-link-grant
            namespace: "{{ skupper_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          spec:
            redemptionsAllowed: 1
            expirationWindow: 1h

    # The grant server (part of the Skupper controller) fills in url/code/ca.
    # On a site without a cloud LoadBalancer this can take a minute; if it
    # stays Pending, the controller needs a restart — the failure says so.
    - name: Wait for the grant to be Ready with a URL
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: AccessGrant
        name: odoo-link-grant
        namespace: "{{ skupper_namespace }}"
      register: grant
      retries: 18
      delay: 10
      until: >-
        grant.resources | length > 0 and
        (grant.resources[0].status.status | default('')) == 'Ready' and
        (grant.resources[0].status.url | default('')) | length > 0 and
        (grant.resources[0].status.code | default('')) | length > 0 and
        (grant.resources[0].status.ca | default('')) | length > 0
      failed_when: false

    # Same wedge, other symptom: the grant server never fills in the URL.
    - name: Restart the Skupper controller if the grant is stuck
      ansible.builtin.include_tasks: skupper_restart_controller.yml
      when: >-
        not (grant.resources | length > 0 and
             (grant.resources[0].status.url | default('')) | length > 0)

    - name: Wait for the grant again (after the restart)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: AccessGrant
        name: odoo-link-grant
        namespace: "{{ skupper_namespace }}"
      register: grant_retry
      retries: 18
      delay: 10
      until: >-
        grant_retry.resources | length > 0 and
        (grant_retry.resources[0].status.status | default('')) == 'Ready' and
        (grant_retry.resources[0].status.url | default('')) | length > 0 and
        (grant_retry.resources[0].status.code | default('')) | length > 0 and
        (grant_retry.resources[0].status.ca | default('')) | length > 0
      failed_when: false
      when: >-
        not (grant.resources | length > 0 and
             (grant.resources[0].status.url | default('')) | length > 0)

    - name: Settle on the latest grant reading
      ansible.builtin.set_fact:
        grant_final: >-
          {{ grant_retry if (grant_retry is defined and grant_retry is not skipped) else grant }}

    - name: Fail with a useful message if the grant never became Ready
      ansible.builtin.assert:
        that:
          - grant_final.resources | length > 0
          - (grant_final.resources[0].status.url | default('')) | length > 0
        fail_msg: >-
          AccessGrant odoo-link-grant on the active site did not become Ready
          with a URL, even after restarting the Skupper controller. The grant
          server on that cluster is not issuing. Check:
          oc get accessgrant -n {{ skupper_namespace }};
          oc get pods -n openshift-operators | grep skupper;
          oc logs -n openshift-operators deploy/skupper-controller --tail=50.

    - name: Stash the grant for the passive site
      ansible.builtin.set_fact:
        grant_url: "{{ grant_final.resources[0].status.url }}"
        grant_code: "{{ grant_final.resources[0].status.code }}"
        grant_ca: "{{ grant_final.resources[0].status.ca }}"

# ─────────────────────────────────────────────────────────────────────────────
- name: Redeem the grant on the passive site
  hosts: passive_site
  gather_facts: false
  tasks:
    - name: Skip if the link already exists
      ansible.builtin.meta: end_play
      when: >-
        not link_needed | bool or
        hostvars['active_site'].link_now_up | default(false) | bool

    # All three share the name token-odoo-active-link. The Secret matters
    # most: it is the link credential the redeem writes. If one survives from
    # an earlier run, the controller keeps re-redeeming against the NEW grant,
    # spends every redemption, and the fresh token gets 404 "No such access
    # granted" even though the grant was just issued (2026-10-06).
    - name: Remove a stale token, link and link Secret from an earlier run
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: token-odoo-active-link
        namespace: "{{ skupper_namespace }}"
        wait: true
      loop:
        - {api_version: skupper.io/v2alpha1, kind: AccessToken}
        - {api_version: skupper.io/v2alpha1, kind: Link}
        - {api_version: v1, kind: Secret}
      loop_control:
        label: "{{ item.kind }}"

    - name: Apply the AccessToken (this is the redeem)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: skupper.io/v2alpha1
          kind: AccessToken
          metadata:
            name: token-odoo-active-link
            namespace: "{{ skupper_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          spec:
            url: "{{ hostvars['active_site'].grant_url }}"
            code: "{{ hostvars['active_site'].grant_code }}"
            ca: "{{ hostvars['active_site'].grant_ca }}"

    - name: Wait for the token to be redeemed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: AccessToken
        name: token-odoo-active-link
        namespace: "{{ skupper_namespace }}"
      register: token
      retries: 12
      delay: 10
      until: token.resources | length > 0 and (token.resources[0].status.redeemed | default(false)) | bool
      failed_when: false

    - name: Fail with the token's own error if redemption did not happen
      ansible.builtin.assert:
        that:
          - token.resources | length > 0
          - (token.resources[0].status.redeemed | default(false)) | bool
        fail_msg: >-
          The AccessToken was not redeemed. Skupper says:
          "{{ token.resources[0].status.message | default('no message') if token.resources | length > 0 else 'token not found' }}".
          A 404 "No such access granted" almost always means the grant ran out
          of redemptions before this token used it — typically a leftover link
          Secret (token-odoo-active-link) being redeemed in a loop. This play
          now deletes that Secret first, so re-run it; check the active
          controller log for "already redeemed" if it repeats. A wrong
          kubeconfig is only the cause if this grant URL is NOT the active
          cluster: {{ hostvars['active_site'].grant_url }}

    # The redeemed token creates the Link; the router then dials the active
    # site's inter-router endpoint. Both Sites report 2 sites when it's up.
    - name: Wait for both sites to see each other
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "{{ skupper_namespace }}"
      register: site_after
      retries: 12
      delay: 10
      until: >-
        site_after.resources | length > 0 and
        (site_after.resources[0].status.sitesInNetwork | default(0) | int) >= 2
      failed_when: false

    # Redeemed but not linked: the usual cause is the active router still
    # serving a certificate the controller has since replaced, so the passive
    # router's TLS handshake fails ("SSL certificate verify failed") and the
    # Link sits Not Operational. Roll the active router once, then wait again.
    - name: Restart the active router if the link did not come up
      ansible.builtin.include_tasks: skupper_restart_router.yml
      vars:
        kubeconfig: "{{ hostvars['active_site'].kubeconfig }}"
        skupper_namespace: "{{ hostvars['active_site'].skupper_namespace }}"
      when: >-
        not (site_after.resources | length > 0 and
             (site_after.resources[0].status.sitesInNetwork | default(0) | int) >= 2)

    - name: Wait for both sites again (after the router restart)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: Site
        namespace: "{{ skupper_namespace }}"
      register: site_retry
      retries: 18
      delay: 10
      until: >-
        site_retry.resources | length > 0 and
        (site_retry.resources[0].status.sitesInNetwork | default(0) | int) >= 2
      failed_when: false
      when: >-
        not (site_after.resources | length > 0 and
             (site_after.resources[0].status.sitesInNetwork | default(0) | int) >= 2)

    # A skipped task overwrites its register, so pick whichever reading ran.
    - name: Settle on the latest Site reading
      ansible.builtin.set_fact:
        site_final: "{{ site_retry if (site_retry is defined and site_retry is not skipped) else site_after }}"

    - name: Fail with a useful message if the sites never linked
      ansible.builtin.assert:
        that:
          - site_final.resources | length > 0
          - (site_final.resources[0].status.sitesInNetwork | default(0) | int) >= 2
        fail_msg: >-
          The token was redeemed but the sites never linked (passive sees
          {{ site_final.resources[0].status.sitesInNetwork | default(0) if site_final.resources | length > 0 else 0 }}
          site(s)), even after restarting the active router. Check
          `oc get link -n {{ skupper_namespace }}` on passive, and the passive
          router log (`oc logs deploy/skupper-router -c router`) for TLS or
          connection errors to the active cluster's inter-router endpoint.

    - name: Report link status
      ansible.builtin.debug:
        msg: "VAN is up — passive Site sees {{ site_final.resources[0].status.sitesInNetwork }} sites. The link carries PostgreSQL and the filestore between clusters."

# ─────────────────────────────────────────────────────────────────────────────
# VolSync rsync-tls: the destination (passive) generates the pre-shared key;
# the source (active) must hold an identical copy. Note the naming quirk: the
# SECRET is volsync-rsync-tls-odoo-data (no -dst-), unlike the Service.
- name: Read the VolSync rsync-tls key from the destination (passive)
  hosts: passive_site
  gather_facts: false
  tasks:
    - name: Wait for VolSync to generate the rsync-tls key secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        name: volsync-rsync-tls-odoo-data
        namespace: "{{ skupper_namespace }}"
      register: rsync_key
      retries: 30
      delay: 10
      until: rsync_key.resources | length > 0

    - name: Stash the key for the active site
      ansible.builtin.set_fact:
        rsync_key_data: "{{ rsync_key.resources[0].data }}"

- name: Apply the rsync-tls key on the source (active)
  hosts: active_site
  gather_facts: false
  tasks:
    - name: Create/refresh the shared rsync-tls key secret on the source
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: volsync-rsync-tls-odoo-data
            namespace: "{{ skupper_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          type: Opaque
          data: "{{ hostvars['passive_site'].rsync_key_data }}"

    - name: Done
      ansible.builtin.debug:
        msg: "rsync-tls key present on both clusters. VolSync's first sync is a full copy (minutes); every sync after is incremental (seconds)."
