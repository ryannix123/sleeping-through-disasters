---
# Service Interconnect Site on the ACTIVE cluster.
apiVersion: skupper.io/v2alpha1
kind: Site
metadata:
  name: odoo-active
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  # This site ACCEPTS the incoming link (it issues the AccessGrant), so it
  # must enable link access. routerMode was a v1 field and is gone in v2.
  linkAccess: default
---
# Connector — publishes the LOCAL PostgreSQL primary onto the VAN.
#
# The Connector lives on the site that owns the workload. The selector targets
# whichever pod CNPG currently marks as primary, so the connector follows an
# in-cluster failover automatically.
apiVersion: skupper.io/v2alpha1
kind: Connector
metadata:
  name: odoo-db-primary
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  routingKey: odoo-db-primary
  port: 5432
  selector: cnpg.io/cluster=odoo-db,cnpg.io/instanceRole=primary
---
# AccessGrant — issues a single-use token the passive site redeems to build
# the link. Rotate by deleting and recreating this resource.
apiVersion: skupper.io/v2alpha1
kind: AccessGrant
metadata:
  name: odoo-passive-grant
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  redemptionsAllowed: 1
  expirationWindow: 168h
---
# Listener — creates a LOCAL Service "odoo-volsync-dest" that tunnels across the
# VAN to the passive cluster's VolSync rsync-tls destination. The active
# ReplicationSource targets this address. Mirrors how the DB primary is reached
# from the passive side, but in the opposite direction.
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: odoo-volsync-dest
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  routingKey: odoo-volsync-dest
  host: odoo-volsync-dest
  port: 8000
