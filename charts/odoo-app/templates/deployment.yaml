{{- $active := eq .Values.role "active" }}
---
{{- if $active }}
# ACTIVE: serving traffic. One replica because the filestore PVC is
# ReadWriteOnce; scaling out needs RWX storage or attachments in the database.
{{- else }}
# PASSIVE: pilot light. Zero replicas until failover; the database replica
# streams continuously regardless.
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  annotations:
    app.openshift.io/runtime: python
    app.openshift.io/connects-to: '[{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","name":"odoo-db"}]'
spec:
  replicas: {{ ternary 1 0 $active }}
  # Recreate because the filestore PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
        app.kubernetes.io/part-of: odoo-dr
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: odoo
          image: "{{ .Values.odoo.image.repository }}:{{ .Values.odoo.image.tag }}"
          imagePullPolicy: {{ .Values.odoo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8069
            - name: longpoll
              containerPort: 8072
          env:
            # Always the read-write Service. After promotion the name is
            # unchanged, so the application needs no reconfiguration.
            - name: DB_HOST
              value: odoo-db-rw
            - name: DB_PORT
              value: "5432"
            # Generated by CloudNativePG into <cluster>-app.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: odoo-db-app
                  key: dbname
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-admin
                  key: admin-password
            - name: ADMIN_LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-admin
                  key: login-password
{{- if $active }}
            # "False" = do NOT run without demo data, i.e. demo data loads.
            # Runs only on first init of the active database.
            - name: WITHOUT_DEMO
              value: {{ ternary "False" "all" .Values.demoData | quote }}
            - name: INITIAL_MODULES
              value: {{ .Values.initialModules | quote }}
{{- else }}
            # The passive site is a database REPLICA: it must never initialise
            # or seed its own data. Everything arrives through replication.
            - name: WITHOUT_DEMO
              value: "all"
{{- end }}
            # Threaded mode. More workers need the longpolling route and a
            # ReadWriteMany filestore (see docs/ARCHITECTURE.md).
            - name: WORKERS
              value: "0"
            - name: LIST_DB
              value: "False"
            - name: ATTACHMENT_LOCATION
              value: {{ .Values.attachmentLocation | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/odoo
          resources:
            {{- toYaml .Values.odoo.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odoo-data
