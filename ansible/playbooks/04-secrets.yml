---
# Phase 3 — the three Secrets that are deliberately not in Git.
#
# The values come from the encrypted vault, so both clusters get IDENTICAL
# content. That matters: a mismatched RESTIC_PASSWORD means the passive site
# silently cannot read the backups it is meant to restore from, and a
# mismatched replication password means the standby never connects.
- name: Create the pattern's secrets on both clusters
  hosts: managed
  gather_facts: false

  tasks:
    - name: Fail early if the vault still has placeholders
      ansible.builtin.assert:
        that:
          - vault_volsync_s3_access_key != 'REPLACE-ME'
          - vault_volsync_s3_secret_key != 'REPLACE-ME'
        fail_msg: >-
          S3 credentials are still placeholders. Run
          'ansible-vault edit group_vars/all/vault.yml' and fill them in.

    - name: Ensure the odoo namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ odoo_namespace }}"

    - name: Odoo admin credentials
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: odoo-admin
            namespace: "{{ odoo_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          type: Opaque
          stringData:
            admin-password: "{{ vault_odoo_admin_password }}"
            login-password: "{{ vault_odoo_login_password }}"

    - name: PostgreSQL replication role credentials
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: odoo-replicator
            namespace: "{{ odoo_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          type: kubernetes.io/basic-auth
          stringData:
            username: replicator
            password: "{{ vault_pg_replicator_password }}"

    - name: VolSync object storage credentials
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: volsync-restic-config
            namespace: "{{ odoo_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          type: Opaque
          stringData:
            AWS_ACCESS_KEY_ID: "{{ vault_volsync_s3_access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ vault_volsync_s3_secret_key }}"
            AWS_DEFAULT_REGION: "{{ volsync_s3_region }}"
            RESTIC_REPOSITORY: "s3:{{ volsync_s3_endpoint }}/{{ volsync_s3_bucket }}/{{ volsync_restic_path }}"
            RESTIC_PASSWORD: "{{ vault_volsync_restic_password }}"
