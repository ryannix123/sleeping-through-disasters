---
# Odoo's master (database manager) password and the admin user's login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.adminSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: odoo-admin
    template:
      type: Opaque
      data:
        admin-password: "{{ `{{ .admin_password }}` }}"
        login-password: "{{ `{{ .login_password }}` }}"
  data:
    - secretKey: admin_password
      remoteRef:
        key: {{ .Values.adminSecret.key }}
        property: admin-password
    - secretKey: login_password
      remoteRef:
        key: {{ .Values.adminSecret.key }}
        property: login-password
