---
# Deploys VolSync ReplicationSource on the active cluster.
# Backs up the SuiteCRM PVC (uploads, custom dir) to S3 every 15 min.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odoo-volsync-active
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: odoo-active
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'odoo-volsync-{{.name}}'
      labels:
        app.kubernetes.io/part-of: odoo-dr
        odoo.io/component: volsync
    spec:
      project: default
      source:
        repoURL: https://github.com/ryannix123/acm-odoo.git
        targetRevision: main
        path: clusters/active/volsync
      destination:
        name: '{{.name}}'
        namespace: odoo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
