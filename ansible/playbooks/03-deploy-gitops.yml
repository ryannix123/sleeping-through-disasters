---
# Phase 1.4 and 2 — apply the hub bootstrap and ApplicationSets to the hub,
# then hand off to Argo CD, which installs operators and deploys to both
# managed clusters.
#
# Early sync failures are expected: the postgres, interconnect and volsync
# Applications cannot succeed until their CRDs exist. Argo retries.
- name: Apply hub bootstrap and ApplicationSets
  hosts: hub
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Apply hub/ (ManagedClusterSet, Placements, GitOpsCluster)
      ansible.builtin.include_tasks: apply_dir.yml
      vars:
        dir_path: "{{ repo_root }}/hub"

    - name: Apply the ApplicationSets
      ansible.builtin.include_tasks: apply_dir.yml
      vars:
        dir_path: "{{ repo_root }}/applicationsets"

    - name: Apply the ACM policies
      ansible.builtin.include_tasks: apply_dir.yml
      vars:
        dir_path: "{{ repo_root }}/policies"

    - name: Note
      ansible.builtin.debug:
        msg: >-
          ApplicationSets and policies applied to the hub. Argo CD is now
          installing operators and deploying to both managed clusters. Watch
          progress in the ACM console (Governance) and the Argo CD UI, or run
          playbooks/99-verify.yml once syncs settle.
