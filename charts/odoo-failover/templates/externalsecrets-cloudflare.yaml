{{- if .Values.global.odooDR.cloudflare.enabled }}
---
# Validates the cf-webhook-auth header on Cloudflare's health webhook.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-webhook-secret
  namespace: odoo
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.cloudflareSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: cloudflare-webhook-secret
    template:
      type: Opaque
      data:
        secret: "{{ `{{ .webhook_secret }}` }}"
  data:
    - secretKey: webhook_secret
      remoteRef:
        key: {{ .Values.cloudflareSecret.key }}
        property: webhook-secret
---
# Read-only API token the poller uses to read pool health.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: odoo
  labels:
    {{- include "odoo-dr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.cloudflareSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: cloudflare-api-token
    template:
      type: Opaque
      data:
        token: "{{ `{{ .api_token }}` }}"
  data:
    - secretKey: api_token
      remoteRef:
        key: {{ .Values.cloudflareSecret.key }}
        property: api-token
{{- end }}
