---
# Phase 3 — hub bootstrap + distribute the pattern secrets to BOTH managed
# clusters via an ACM Policy, applied only to the hub.
#
# ORDER MATTERS: this runs BEFORE the GitOps hand-off (04). CloudNativePG
# creates the "replicator" role from the odoo-replicator Secret at bootstrap;
# if the Secret is not there yet the role is never created and the passive
# replica can never authenticate (found on a fresh from-the-top deploy). So
# this play creates the odoo namespace AND the secrets on both clusters first,
# then 04 lets Argo deploy the workloads into a namespace whose credentials
# already exist.
#
# This is the ACM-native way: we declare the secrets once on the hub as an
# enforced ConfigurationPolicy bound to the "both clusters" placement, and ACM
# pushes them to active and passive, keeping them in sync. No managed-cluster
# kubeconfig, no per-cluster loop.
#
# The secret VALUES come from the encrypted vault. For a demo this templates
# them into the Policy on the hub. For production, source them from a
# SealedSecret or External Secrets Operator instead (see docs/ARCHITECTURE.md).
- name: Distribute pattern secrets via an ACM Policy
  hosts: hub
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    # The Policy needs the policy namespace, the ManagedClusterSet and its
    # bindings — all in hub/. Idempotent; 04 applies the same directory again.
    - name: Apply hub/ (ManagedClusterSet, Placements, GitOpsCluster, policy namespace)
      ansible.builtin.include_tasks: apply_dir.yml
      vars:
        dir_path: "{{ repo_root }}/hub"

    - name: Apply the secret-distribution Policy to the hub
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          metadata:
            name: odoo-secrets
            namespace: "{{ acm_policy_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          spec:
            remediationAction: enforce
            disabled: false
            policy-templates:
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: odoo-secrets-config
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      # Namespace first: the workloads' namespace exists (with
                      # the secrets in it) before Argo deploys anything.
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Namespace
                          metadata:
                            name: "{{ odoo_namespace }}"
                            labels:
                              app.kubernetes.io/part-of: odoo-dr
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: odoo-admin
                            namespace: "{{ odoo_namespace }}"
                          type: Opaque
                          stringData:
                            admin-password: "{{ vault_odoo_admin_password }}"
                            login-password: "{{ vault_odoo_login_password }}"
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: odoo-replicator
                            namespace: "{{ odoo_namespace }}"
                          type: kubernetes.io/basic-auth
                          stringData:
                            username: replicator
                            password: "{{ vault_pg_replicator_password }}"
                      # Failover automation (clusters/passive/failover):
                      # validates the Cloudflare webhook's cf-webhook-auth header.
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: cloudflare-webhook-secret
                            namespace: "{{ odoo_namespace }}"
                            labels:
                              app.kubernetes.io/part-of: odoo-dr
                          type: Opaque
                          stringData:
                            secret: "{{ vault_cloudflare_webhook_secret }}"
                      # Used by the free-tier poller to read pool health.
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: cloudflare-api-token
                            namespace: "{{ odoo_namespace }}"
                            labels:
                              app.kubernetes.io/part-of: odoo-dr
                          type: Opaque
                          stringData:
                            token: "{{ vault_cloudflare_api_token }}"

    - name: Bind the Policy to both managed clusters
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: policy.open-cluster-management.io/v1
          kind: PlacementBinding
          metadata:
            name: odoo-secrets
            namespace: "{{ acm_policy_namespace }}"
          placementRef:
            name: odoo-policy-both
            apiGroup: cluster.open-cluster-management.io
            kind: Placement
          subjects:
            - name: odoo-secrets
              apiGroup: policy.open-cluster-management.io
              kind: Policy

    - name: Ensure a "both clusters" Placement exists in the policy namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: cluster.open-cluster-management.io/v1beta1
          kind: Placement
          metadata:
            name: odoo-policy-both
            namespace: "{{ acm_policy_namespace }}"
          spec:
            clusterSets:
              - "{{ clusterset_name }}"

    - name: Wait for the Policy to report Compliant on both clusters
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        name: odoo-secrets
        namespace: "{{ acm_policy_namespace }}"
      register: pol
      retries: 20
      delay: 15
      until: pol.resources[0].status.compliant | default('') == 'Compliant'
