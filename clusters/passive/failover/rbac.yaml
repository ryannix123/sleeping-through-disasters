---
# ServiceAccount the failover Pipeline runs as. Scoped to the odoo namespace:
# it can promote the CNPG cluster, scale the Odoo Deployment, and exec into
# the database pod for the WAL witness. Nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]      # the poller creates PipelineRuns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-failover
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
subjects:
  - kind: ServiceAccount
    name: dr-failover
    namespace: odoo
roleRef:
  kind: Role
  name: dr-failover
  apiGroup: rbac.authorization.k8s.io
