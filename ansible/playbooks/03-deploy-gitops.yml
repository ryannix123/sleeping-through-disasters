---
# Phase 1.4 and 2 — apply the hub bootstrap and the ApplicationSets, then
# wait for the four operators to install on both managed clusters.
#
# Early sync failures are expected here: the postgres, interconnect and
# volsync Applications cannot succeed until their CRDs exist. Argo retries.
- name: Apply hub bootstrap and ApplicationSets
  hosts: hub
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Apply hub/ (ManagedClusterSet, Placements, GitOpsCluster)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ item }}"
      loop: >-
        {{ lookup('ansible.builtin.fileglob', repo_root ~ '/hub/*.yaml', wantlist=True)
           | map('file') | map('from_yaml_all') | flatten | select('defined')
           | rejectattr('kind', 'equalto', 'Kustomization') | list }}
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

    - name: Apply the ApplicationSets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ item }}"
      loop: >-
        {{ lookup('ansible.builtin.fileglob', repo_root ~ '/applicationsets/*.yaml', wantlist=True)
           | map('file') | map('from_yaml_all') | flatten | select('defined')
           | selectattr('kind', 'equalto', 'ApplicationSet') | list }}
      loop_control:
        label: "{{ item.metadata.name }}"


    - name: Apply the ACM policies (operator + replication compliance)
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop: >-
        {{ lookup('ansible.builtin.fileglob', repo_root ~ '/policies/*.yaml', wantlist=True)
           | map('file') | map('from_yaml_all') | flatten | select('defined')
           | rejectattr('kind','equalto','Kustomization') | list }}
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

    - name: Note
      ansible.builtin.debug:
        msg: >-
          ApplicationSets and policies applied to the hub. Argo CD is now
          installing operators and deploying to both managed clusters. Watch
          progress in the ACM console (Governance) and Argo CD UI, or run
          playbooks/99-verify.yml once syncs settle.
