---
# Placement that selects ALL clusters in the odoo-dr ClusterSet.
# Used for things both clusters need: operators, namespaces, RBAC.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: odoo-both
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  clusterSets:
    - odoo-dr
  # No predicates means: select everything in the bound ClusterSet
