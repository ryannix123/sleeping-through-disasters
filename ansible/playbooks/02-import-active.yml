---
# Phase 1.2 — import the active cluster into ACM, and label both clusters.
#
# The passive cluster IS the hub in this topology (ACM's own local-cluster),
# so it never needs importing — only labelling. The active cluster is
# imported the way the ACM console's "Run import commands" option does it:
#
#   hub:    ManagedCluster + KlusterletAddonConfig  →  ACM writes <name>-import
#   active: apply the import secret's CRDs, then its manifests (the klusterlet)
#   hub:    wait until the cluster reports Joined and Available
#
# It also handles the case that cost time on 4 Oct 2026: an active cluster
# still registered to a hub that no longer exists (the demo hub retired, the
# homelab did not). If the klusterlet on the active site points at a
# different hub API than this one, the stale registration is removed first.
#
# Idempotent: if the active cluster is already Available on this hub, the
# import is skipped and only the labels are (re)applied.
#
#   ansible-playbook playbooks/02-import-active.yml

# ─────────────────────────────────────────────────────────────────────────────
- name: Hub — register the active cluster and label both
  hosts: hub
  gather_facts: false

  tasks:
    - name: Read the hub's own API URL
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: infra

    - name: Read the active ManagedCluster, if any
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ active_cluster_name }}"
      register: mc_before

    - name: Decide whether an import is needed
      ansible.builtin.set_fact:
        hub_api: "{{ infra.resources[0].status.apiServerURL }}"
        import_needed: >-
          {{ not (mc_before.resources | length > 0 and
                  (mc_before.resources[0].status.conditions | default([])
                   | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable')
                   | selectattr('status', 'equalto', 'True') | list | length > 0)) }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ active_cluster_name ~ ' is already Available on this hub — skipping the import, re-applying labels.'
             if not (import_needed | bool) else
             'Importing ' ~ active_cluster_name ~ ' into the hub at ' ~ hub_api }}

    # The clusterset must exist before a cluster can be labelled into it.
    # hub/01-managedclusterset.yaml declares the same object; applying it here
    # first is harmless and lets this play run before 03.
    - name: Ensure the ManagedClusterSet exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: cluster.open-cluster-management.io/v1beta2
          kind: ManagedClusterSet
          metadata:
            name: "{{ clusterset_name }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          spec:
            clusterSelector:
              selectorType: ExclusiveClusterSetLabel

    - name: Register the active cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: cluster.open-cluster-management.io/v1
          kind: ManagedCluster
          metadata:
            name: "{{ active_cluster_name }}"
            labels:
              cluster.open-cluster-management.io/clusterset: "{{ clusterset_name }}"
              role: active
              cloud: auto-detect
              vendor: auto-detect
          spec:
            hubAcceptsClient: true

    - name: Wait for ACM to create the cluster namespace
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Namespace
        name: "{{ active_cluster_name }}"
      register: mc_ns
      retries: 12
      delay: 5
      until: mc_ns.resources | length > 0

    - name: Enable the add-ons the pattern relies on (policies, app lifecycle)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: agent.open-cluster-management.io/v1
          kind: KlusterletAddonConfig
          metadata:
            name: "{{ active_cluster_name }}"
            namespace: "{{ active_cluster_name }}"
          spec:
            applicationManager: { enabled: true }
            certPolicyController: { enabled: true }
            policyController: { enabled: true }
            searchCollector: { enabled: true }

    - name: Wait for the import secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        name: "{{ active_cluster_name }}-import"
        namespace: "{{ active_cluster_name }}"
      register: import_secret
      retries: 24
      delay: 5
      until: >-
        import_secret.resources | length > 0 and
        'import.yaml' in (import_secret.resources[0].data | default({}))
      when: import_needed | bool

    - name: Stash the import manifests for the active site
      ansible.builtin.set_fact:
        import_crds: >-
          {{ (import_secret.resources[0].data['crds.yaml']
              | default(import_secret.resources[0].data['crdsv1.yaml'])) | b64decode }}
        import_manifests: "{{ import_secret.resources[0].data['import.yaml'] | b64decode }}"
      when: import_needed | bool

    # ── The passive side: the hub's own local-cluster ────────────────────────
    - name: Read the passive ManagedCluster (the hub itself)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ passive_cluster_name }}"
      register: passive_mc

    - name: The hub must manage itself — the passive role depends on it
      ansible.builtin.assert:
        that: passive_mc.resources | length > 0
        fail_msg: >-
          ManagedCluster {{ passive_cluster_name }} does not exist. This hub has
          self-management turned off (MultiClusterHub spec.disableHubSelfManagement),
          so it cannot be the passive site. Turn it back on:
          oc patch multiclusterhub multiclusterhub -n open-cluster-management
          --type merge -p '{"spec":{"disableHubSelfManagement":false}}'

    - name: Label the passive cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ passive_cluster_name }}"
        definition:
          metadata:
            labels:
              cluster.open-cluster-management.io/clusterset: "{{ clusterset_name }}"
              role: passive

# ─────────────────────────────────────────────────────────────────────────────
- name: Active site — remove a stale registration, then apply the import
  hosts: active_site
  gather_facts: false

  tasks:
    - name: Skip if the cluster is already imported
      ansible.builtin.meta: end_play
      when: not hostvars['hub'].import_needed | bool

    - name: Read the bootstrap kubeconfig the klusterlet is using, if any
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        name: bootstrap-hub-kubeconfig
        namespace: open-cluster-management-agent
      register: bootstrap

    - name: Which hub is it registered to?
      ansible.builtin.set_fact:
        registered_hub: >-
          {{ ((bootstrap.resources[0].data.kubeconfig | b64decode | from_yaml).clusters[0].cluster.server)
             if bootstrap.resources | length > 0 else '' }}

    - name: Decide whether the registration is stale
      ansible.builtin.set_fact:
        stale: >-
          {{ registered_hub | length > 0 and
             (registered_hub | regex_replace('/+$', '')) != (hostvars['hub'].hub_api | regex_replace('/+$', '')) }}

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ 'Klusterlet is registered to ' ~ registered_hub ~ ', not this hub — removing the stale registration first.'
             if stale | bool else
             ('Klusterlet already points at this hub — re-applying the import.' if registered_hub | length > 0
              else 'No existing klusterlet — fresh import.') }}

    # ── Stale registration cleanup ───────────────────────────────────────────
    - name: Delete the stale Klusterlet
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: operator.open-cluster-management.io/v1
        kind: Klusterlet
        name: klusterlet
        wait: false
      when: stale | bool

    - name: Wait for the Klusterlet to finish cleaning up
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: operator.open-cluster-management.io/v1
        kind: Klusterlet
        name: klusterlet
      register: kl
      retries: 12
      delay: 10
      until: kl.resources | length == 0
      failed_when: false
      when: stale | bool

    # If the klusterlet operator could not finish (its hub is gone), its
    # finalizer holds the object forever. Release it.
    - name: Release a Klusterlet stuck on its finalizer
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: patched
        api_version: operator.open-cluster-management.io/v1
        kind: Klusterlet
        name: klusterlet
        definition:
          metadata:
            finalizers: []
      when: stale | bool and kl.resources | default([]) | length > 0

    - name: Delete the stale agent namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        kind: Namespace
        name: "{{ item }}"
        wait: true
        wait_timeout: 300
      loop:
        - open-cluster-management-agent
        - open-cluster-management-agent-addon
      when: stale | bool

    # ── Import ───────────────────────────────────────────────────────────────
    - name: Apply the klusterlet CRDs
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        apply: true
        definition: "{{ hostvars['hub'].import_crds | from_yaml_all | select | list }}"

    - name: Wait for the Klusterlet CRD to be established
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: klusterlets.operator.open-cluster-management.io
      register: kl_crd
      retries: 12
      delay: 5
      until: >-
        kl_crd.resources | length > 0 and
        (kl_crd.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Established')
         | selectattr('status', 'equalto', 'True') | list | length > 0)

    # Retried because API discovery can lag a freshly created CRD.
    - name: Apply the import manifests (the klusterlet)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        apply: true
        definition: "{{ hostvars['hub'].import_manifests | from_yaml_all | select | list }}"
      register: import_applied
      retries: 6
      delay: 10
      until: import_applied is succeeded

# ─────────────────────────────────────────────────────────────────────────────
- name: Hub — wait for the active cluster to join
  hosts: hub
  gather_facts: false

  tasks:
    - name: Wait for the active cluster to be Joined and Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ active_cluster_name }}"
      register: mc_after
      retries: 36
      delay: 10
      until: >-
        mc_after.resources | length > 0 and
        (mc_after.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable')
         | selectattr('status', 'equalto', 'True') | list | length > 0)

    - name: Read both clusters back
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item }}"
      loop:
        - "{{ active_cluster_name }}"
        - "{{ passive_cluster_name }}"
      register: both

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ item.resources[0].metadata.name }}
          · role={{ item.resources[0].metadata.labels.role | default('MISSING') }}
          · clusterset={{ item.resources[0].metadata.labels['cluster.open-cluster-management.io/clusterset'] | default('MISSING') }}
          · Available={{ item.resources[0].status.conditions | default([])
                         | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable')
                         | map(attribute='status') | first | default('Unknown') }}
      loop: "{{ both.results }}"
      loop_control:
        label: "{{ item.item }}"
