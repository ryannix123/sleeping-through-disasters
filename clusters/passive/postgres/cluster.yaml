---
# CloudNativePG replica cluster for the passive site.
#
# It streams WAL from the active cluster's primary. The primary is reachable
# at "odoo-db-primary" — a local Service created by the Service Interconnect
# Listener, which tunnels across the VAN to the active cluster.
#
# TO FAIL OVER: set spec.replica.enabled to false and commit.
# Argo CD applies it and CNPG promotes this cluster to primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: odoo-db
  namespace: odoo
  annotations:
    # Argo must never delete this resource — not on prune, not on Application
    # deletion. It holds customer data.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: odoo-dr
    app.kubernetes.io/component: database
    odoo.dr/role: standby
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  instances: 1

  # ---- Replica mode. Flip to false to promote. ----
  replica:
    enabled: true
    source: odoo-db-active

  bootstrap:
    pg_basebackup:
      source: odoo-db-active
      # MUST match the source's initdb (clusters/active/postgres/cluster.yaml).
      # pg_basebackup copies the source's roles and databases verbatim, but
      # CNPG still generates this cluster's odoo-db-app Secret from these two
      # fields — and defaults them to app/app if omitted. That produced a
      # Secret for a role that did not exist in the replicated data, and Odoo
      # could not log in to the database it had just failed over to.
      database: odoo
      owner: odoo

  externalClusters:
    - name: odoo-db-active
      connectionParameters:
        # Local Service published by the Interconnect Listener.
        host: odoo-db-primary
        port: "5432"
        user: replicator
        dbname: odoo
        sslmode: require
      password:
        # Same Secret, same value, as on the active cluster.
        name: odoo-replicator
        key: password

  storage:
    size: 20Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"

  monitoring:
    enablePodMonitor: true
