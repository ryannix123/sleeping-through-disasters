---
# Deploys the Odoo application on the active cluster (full operation, replicas: 1).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odoo-app-active
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: odoo-active
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'odoo-app-{{.name}}'
      labels:
        app.kubernetes.io/part-of: odoo-dr
        odoo.io/component: application
    spec:
      project: default
      source:
        repoURL: https://github.com/ryannix123/acm-odoo.git
        targetRevision: main
        path: clusters/active/odoo
      destination:
        name: '{{.name}}'
        namespace: odoo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            maxDuration: 5m
            factor: 2
