---
# Odoo scaled to zero on the passive cluster until failover.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odoo-app-passive
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # DATA-PLANE PROTECTION. By default a generated Application carries the
  # resources finalizer, so deleting or regenerating it deletes every resource
  # it owns — databases and volumes included. Observed: control-plane churn
  # (re-registering the GitOpsCluster) rebuilt the odoo namespace from scratch.
  # A DR pattern's control plane must never be able to delete the data it
  # protects: Applications may be created and updated, never deleted by the
  # generator, and deleting one orphans (re-adopts later) its resources.
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: odoo-passive
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'odoo-app-passive-{{.name}}'
      labels:
        app.kubernetes.io/part-of: odoo-dr
    spec:
      project: default
      source:
        repoURL: https://github.com/ryannix123/sleeping-through-disasters.git
        targetRevision: main
        path: clusters/passive/odoo
      destination:
        name: '{{.name}}'
        namespace: odoo
      # The failover Pipeline scales this Deployment 0 -> 1 at runtime. Git
      # says 0 (pilot-light). Without this, Argo self-heals the scale-up back
      # to 0 within seconds — observed during the first failover test.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: odoo
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 30s
            maxDuration: 5m
            factor: 2
