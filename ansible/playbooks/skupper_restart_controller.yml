---
# Included by 05-interconnect-link.yml — restart the Skupper controller on the
# current site and wait for its replacement to be Ready.
#
# Why this exists: on four mornings out of four (Sep–Oct 2026) the active
# site's controller came up after a reboot and never marked its Site Ready, or
# its grant server never issued a grant. Restarting the controller pod cleared
# it every time. The playbook now does that itself, once, before giving up.
#
# Expects: kubeconfig. Optional: skupper_controller_namespace,
# skupper_controller_selector.

- name: Find the Skupper controller pod(s)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    kind: Pod
    namespace: "{{ skupper_controller_namespace | default('openshift-operators') }}"
    label_selectors:
      - "{{ skupper_controller_selector | default('app.kubernetes.io/name=skupper-controller') }}"
  register: skupper_ctrl_pods

- name: Restart the Skupper controller (known wedge)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    kind: Pod
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
    wait: false
  loop: "{{ skupper_ctrl_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Wait for the replacement controller to be Ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    kind: Pod
    namespace: "{{ skupper_controller_namespace | default('openshift-operators') }}"
    label_selectors:
      - "{{ skupper_controller_selector | default('app.kubernetes.io/name=skupper-controller') }}"
  register: skupper_ctrl_new
  retries: 18
  delay: 10
  until: >-
    skupper_ctrl_new.resources
    | rejectattr('metadata.deletionTimestamp', 'defined')
    | rejectattr('metadata.name', 'in', skupper_ctrl_pods.resources | map(attribute='metadata.name') | list)
    | map(attribute='status.conditions') | map('default', [])
    | map('selectattr', 'type', 'equalto', 'Ready')
    | map('selectattr', 'status', 'equalto', 'True')
    | map('list') | select | list | length > 0

- name: Let the new controller reconcile the Site
  ansible.builtin.pause:
    seconds: 30
