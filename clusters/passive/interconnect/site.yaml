---
# Service Interconnect Site on the PASSIVE cluster.
apiVersion: skupper.io/v2alpha1
kind: Site
metadata:
  name: odoo-passive
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  routerMode: interior
---
# Listener — creates a LOCAL Service named "odoo-db-primary" that tunnels
# across the VAN to the active cluster's PostgreSQL primary.
#
# The CNPG replica cluster points its externalClusters host at this name.
# Note it deliberately does NOT collide with the local "odoo-db-rw" service.
apiVersion: skupper.io/v2alpha1
kind: Listener
metadata:
  name: odoo-db-primary
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  routingKey: odoo-db-primary
  host: odoo-db-primary
  port: 5432
---
# AccessToken — redeems the grant issued on the active cluster and
# establishes the link. The referenced Secret is transferred once during
# bootstrap; see docs/BOOTSTRAP.md.
apiVersion: skupper.io/v2alpha1
kind: AccessToken
metadata:
  name: odoo-active-link
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  secret: odoo-active-token
---
# Connector — publishes the LOCAL VolSync rsync-tls destination Service onto the
# VAN, so the active site's ReplicationSource can reach it. This is the reverse
# direction from the database: for filestore replication the passive site owns
# the exposed endpoint (the destination), so the Connector lives here.
#
# VolSync's rsync-tls destination creates a Service named after the
# ReplicationDestination ("odoo-data"). We publish it under a distinct routing
# key so it does not collide with anything on the active side.
apiVersion: skupper.io/v2alpha1
kind: Connector
metadata:
  name: odoo-volsync-dest
  namespace: odoo
  labels:
    app.kubernetes.io/part-of: odoo-dr
spec:
  routingKey: odoo-volsync-dest
  port: 8000
  # VolSync names the destination Service volsync-rsync-tls-dst-<dest name>.
  # Our ReplicationDestination is "odoo-data".
  host: volsync-rsync-tls-dst-odoo-data
