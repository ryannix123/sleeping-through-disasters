---
# Phase 5 — establish the Service Interconnect link using the official
# skupper.v2 Ansible collection.
#
# This is the Skupper-dev-endorsed path. The Site, Connector and Listener are
# already deployed by the GitOps ApplicationSets; all that remains is the token
# handshake, which the collection reduces to two tasks:
#
#   1. active site issues an AccessToken   -> register it as an Ansible fact
#   2. passive site applies that fact       -> link forms over mTLS
#
# The token round-trips through hostvars, so there is no manual export, rename,
# or metadata stripping. Each task targets its own cluster via kubeconfig.
#
# This is the ONE play that talks to the managed clusters directly. It is a
# one-time bootstrap handshake, not reconciliation, so using the purpose-built
# module here is the right tool rather than a departure from the ACM model.
# Requires:  ansible-galaxy collection install skupper.v2

- name: Issue an access token on the active site
  hosts: active_site
  gather_facts: false
  tasks:
    - name: Create a token from the active (primary) site
      skupper.v2.token:
        name: odoo-active-link
        kubeconfig: "{{ kubeconfig }}"
        namespace: "{{ skupper_namespace }}"
        redemptions_allowed: 1
      register: active_token

    - name: Confirm the token was issued
      ansible.builtin.assert:
        that:
          - active_token.token is defined
        fail_msg: >-
          Skupper did not return a token. Check that the active Site is Ready
          (oc get site -n {{ skupper_namespace }}) and that skupper.v2 is
          installed.
        success_msg: "Access token issued by the active site."

- name: Redeem the token on the passive site
  hosts: passive_site
  gather_facts: false
  tasks:
    - name: Apply the token to the passive (consumer) site
      skupper.v2.resource:
        def: "{{ hostvars['active_site'].active_token.token }}"
        kubeconfig: "{{ kubeconfig }}"
        namespace: "{{ skupper_namespace }}"

    - name: Give the link a moment to establish
      ansible.builtin.pause:
        seconds: 15

    - name: Read back the AccessToken status
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: skupper.io/v2alpha1
        kind: AccessToken
        name: odoo-active-link
        namespace: "{{ skupper_namespace }}"
      register: token_status
      retries: 12
      delay: 10
      until: >-
        (token_status.resources[0].status.conditions | default([]))
        | selectattr('type','equalto','Redeemed')
        | selectattr('status','equalto','True') | list | length > 0
      failed_when: false

    - name: Report link status
      ansible.builtin.debug:
        msg: >-
          {{ 'Interconnect link is up — the VAN carries PostgreSQL between sites.'
             if (token_status.resources[0].status.conditions | default([]))
                | selectattr('type','equalto','Redeemed')
                | selectattr('status','equalto','True') | list | length > 0
             else 'Token applied but not yet Redeemed. Check Site readiness on both clusters and re-run.' }}

- name: Copy the VolSync rsync-tls key from the destination (passive) to the source (active)
  hosts: passive_site
  gather_facts: false
  tasks:
    - name: Wait for VolSync to generate the rsync-tls key secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        name: volsync-rsync-tls-dst-odoo-data
        namespace: "{{ skupper_namespace }}"
      register: rsync_key
      retries: 30
      delay: 10
      until: rsync_key.resources | length > 0

    - name: Stash the key for the active site
      ansible.builtin.set_fact:
        rsync_key_data: "{{ rsync_key.resources[0].data }}"

- name: Apply the rsync-tls key on the active site
  hosts: active_site
  gather_facts: false
  tasks:
    - name: Create the shared rsync-tls key secret on the source
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: volsync-rsync-tls-dst-odoo-data
            namespace: "{{ skupper_namespace }}"
            labels:
              app.kubernetes.io/part-of: odoo-dr
          type: Opaque
          data: "{{ hostvars['passive_site'].rsync_key_data }}"
