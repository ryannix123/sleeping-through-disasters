<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990">
  <title>Sleeping Through Disasters — active/passive DR for Odoo 19 on OpenShift</title>
  <desc>Odoo 19 CRM/ERP running active/passive across two OpenShift single-node clusters. CloudNativePG streams WAL and VolSync copies the filestore PVC-to-PVC over an mTLS Service Interconnect virtual application network. No object storage in the replication path.</desc>

  <defs>
    <style><![CDATA[
      .f      { font-family: 'Red Hat Text','Red Hat Display','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .title  { font-size: 26px; font-weight: 700; fill: #151515; }
      .sub    { font-size: 14px; fill: #6a6e73; }
      .hdr    { font-size: 17px; font-weight: 700; fill: #151515; }
      .hdrsub { font-size: 12px; fill: #6a6e73; }
      .ct     { font-size: 13.5px; font-weight: 700; fill: #151515; }
      .cs     { font-size: 11.5px; fill: #4d4d4d; }
      .band   { font-size: 12px; fill: #151515; }
      .bandxs { font-size: 10px; fill: #6a6e73; }
      .kicker { font-size: 9px; font-weight: 700; fill: #6a6e73; letter-spacing: 1.1px; }
      .flow   { font-size: 11.5px; font-weight: 700; fill: #151515; }
      .flows  { font-size: 11px; fill: #4d4d4d; }
      .lgd    { font-size: 12px; fill: #4d4d4d; }
      .foot   { font-size: 12.5px; fill: #4d4d4d; }
      .footh  { font-size: 13px; font-weight: 700; fill: #151515; }
      .red    { fill: #ee0000; }
      .blue   { fill: #0066cc; }
      .green  { fill: #3e8635; }
    ]]></style>
  </defs>

  <g id="canvas">
    <rect x="0" y="0" width="1400" height="990" fill="#ffffff"/>
  </g>

  <!-- ══════════════════════ TITLE ══════════════════════ -->
  <g id="title" class="f">
    <rect x="50" y="18" width="5" height="30" fill="#ee0000"/>
    <text x="68" y="34" class="title">Sleeping Through Disasters</text>
    <text x="68" y="53" class="sub">Odoo 19 CRM/ERP, active/passive across two OpenShift single-node clusters — on-premises and AWS</text>
    <text x="1350" y="53" class="sub" text-anchor="end">github.com/ryannix123/sleeping-through-disasters</text>
  </g>

<g id="diagram" transform="translate(0,50)">

  <!-- ══════════════════════ TOP ROW ══════════════════════ -->

  <g id="users" class="f">
    <rect x="50" y="86" width="130" height="64" rx="8" fill="#ffffff" stroke="#151515" stroke-width="1.5"/>
    <text x="115" y="113" class="ct" text-anchor="middle">Users</text>
    <text x="115" y="131" class="cs" text-anchor="middle">erp.example.com</text>
  </g>

  <g id="edge" class="f">
    <rect x="215" y="78" width="300" height="80" rx="8" fill="#f5faff" stroke="#0066cc" stroke-width="1.5"/>
    <text x="235" y="104" class="ct">Global load balancer (Cloudflare)</text>
    <text x="235" y="122" class="cs">Health check every 60s · DNS TTL 30s</text>
    <text x="235" y="139" class="cs" fill="#6a6e73">Not included — bring your own GLB/GTM</text>
  </g>

  <g id="git" class="f">
    <rect x="700" y="78" width="230" height="80" rx="8" fill="#ffffff" stroke="#151515" stroke-width="1.5"/>
    <text x="720" y="104" class="ct">Git repository</text>
    <text x="720" y="122" class="cs">Every manifest in the pattern</text>
    <text x="720" y="139" class="cs">The single source of truth</text>
  </g>

  <g id="hub" class="f">
    <rect x="990" y="78" width="360" height="80" rx="8" fill="#fdf2f2" stroke="#ee0000" stroke-width="1.5"/>
    <text x="1012" y="104" class="ct">Hub cluster</text>
    <text x="1012" y="122" class="cs">Advanced Cluster Management — imports the active site</text>
    <text x="1012" y="139" class="cs">Validated Patterns — clustergroup per site · Vault secrets</text>
  </g>

  <!-- ══════════════════════ CONNECTORS ══════════════════════ -->

  <g id="flow-users-to-edge" class="f">
    <path d="M180 118 H 206" stroke="#0066cc" stroke-width="2" fill="none"/>
    <polygon points="215,118 205,113 205,123" fill="#0066cc"/>
  </g>

  <g id="flow-git-to-hub" class="f">
    <path d="M930 118 H 981" stroke="#151515" stroke-width="2" fill="none"/>
    <polygon points="990,118 980,113 980,123" fill="#151515"/>
  </g>

  <g id="flow-edge-to-active" class="f">
    <path d="M330 158 V 241" stroke="#0066cc" stroke-width="2.5" fill="none"/>
    <polygon points="330,250 324,239 336,239" fill="#0066cc"/>
    <text x="340" y="196" class="flow" fill="#0066cc">live traffic</text>
    <text x="340" y="211" class="flows">all users land here</text>
  </g>

  <g id="flow-edge-to-passive" class="f">
    <path d="M470 158 V 186 H 1070 V 241" stroke="#0066cc" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
    <polygon points="1070,250 1064,239 1076,239" fill="#0066cc"/>
    <text x="1082" y="204" class="flow" fill="#0066cc">standby pool</text>
    <text x="1082" y="219" class="flows">takes over when the active pool fails its check</text>
  </g>

  <g id="flow-hub-to-active" class="f">
    <path d="M1010 78 V 34 H 25 V 292 H 41" stroke="#8a8d90" stroke-width="1.8" fill="none" stroke-dasharray="2 4"/>
    <polygon points="50,292 40,287 40,297" fill="#8a8d90"/>
  </g>

  <g id="flow-hub-to-passive" class="f">
    <path d="M1330 158 V 200 H 1375 V 292 H 1359" stroke="#8a8d90" stroke-width="1.8" fill="none" stroke-dasharray="2 4"/>
    <polygon points="1350,292 1360,287 1360,297" fill="#8a8d90"/>
  </g>

  <!-- ══════════════════════ ACTIVE CLUSTER ══════════════════════ -->

  <g id="active-cluster" class="f">
    <rect x="50" y="250" width="560" height="475" rx="12" fill="#fafafa" stroke="#151515" stroke-width="2"/>
    <rect x="50" y="250" width="560" height="6" rx="3" fill="#3e8635"/>

    <text x="70" y="284" class="hdr">ACTIVE — OpenShift single node, on-premises</text>
    <text x="70" y="303" class="hdrsub">Serving production · holds the only writable copy</text>

    <g id="active-app">
      <rect x="70" y="314" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="70" y="314" width="4" height="58" rx="2" fill="#3e8635"/>
      <text x="88" y="337" class="ct">Odoo 19 CRM/ERP</text>
      <text x="88" y="356" class="cs">Running · attachments and documents on the filestore PVC</text>
    </g>

    <g id="active-db">
      <rect x="70" y="381" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="70" y="381" width="4" height="58" rx="2" fill="#3e8635"/>
      <text x="88" y="404" class="ct">CloudNativePG (Postgres) — primary</text>
      <text x="88" y="423" class="cs">Tier 1: synchronous replica in-cluster · zero data loss on node failure</text>
    </g>

    <g id="active-volsync">
      <rect x="70" y="448" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="70" y="448" width="4" height="58" rx="2" fill="#3e8635"/>
      <text x="88" y="471" class="ct">VolSync — ReplicationSource</text>
      <text x="88" y="490" class="cs">Sends the filestore to the passive PVC over rsync-tls, every 2 minutes</text>
    </g>

    <g id="active-rhsi">
      <rect x="70" y="515" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="70" y="515" width="4" height="58" rx="2" fill="#3e8635"/>
      <text x="88" y="538" class="ct">Red Hat Service Interconnect — Site + Connector</text>
      <text x="88" y="557" class="cs">Publishes the Postgres primary onto the VAN · no VPN, no public database port</text>
    </g>

    <g id="active-oadp">
      <rect x="70" y="582" width="520" height="58" rx="6" fill="#ffffff" stroke="#b8bbbe" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text x="88" y="605" class="ct" fill="#4d4d4d">OADP (Velero) — optional</text>
      <text x="88" y="624" class="cs">Point-in-time namespace backup · not in the replication path</text>
    </g>

    <g id="active-note">
      <text x="88" y="672" class="cs" fill="#6a6e73">Both clusters run the same operators, from the same Git repo,</text>
      <text x="88" y="690" class="cs" fill="#6a6e73">each pulling its own clustergroup. Either can play either role.</text>
    </g>
  </g>

  <!-- ══════════════════════ THE VAN BAND ══════════════════════ -->

  <g id="van-band" class="f">
    <rect x="618" y="250" width="164" height="475" rx="12" fill="#fdf2f2" stroke="#ee0000" stroke-width="1.5" stroke-dasharray="6 4"/>

    <text x="700" y="281" class="kicker" text-anchor="middle">RED HAT</text>
    <text x="700" y="295" class="kicker" text-anchor="middle">SERVICE INTERCONNECT</text>
    <text x="700" y="317" class="band" text-anchor="middle">mTLS Virtual</text>
    <text x="700" y="333" class="band" text-anchor="middle">Application Network</text>
    <text x="700" y="350" class="bandxs" text-anchor="middle">Layer 7 · mutual TLS</text>

    <g id="van-divider-top">
      <path d="M646 604 H 754" stroke="#ee0000" stroke-width="1" opacity="0.35"/>
    </g>

    <text x="700" y="632" class="kicker red" text-anchor="middle">NO OBJECT STORAGE</text>
    <text x="700" y="650" class="bandxs" text-anchor="middle">in the replication path</text>
    <text x="700" y="678" class="bandxs" text-anchor="middle">One tunnel carries both</text>
    <text x="700" y="692" class="bandxs" text-anchor="middle">streams, cluster to cluster</text>
  </g>

  <!-- ══════════════════════ CROSS-CLUSTER FLOWS ══════════════════════ -->

  <g id="flow-database" class="f">
    <text x="700" y="382" class="flow" text-anchor="middle">Tier 2 — asynchronous</text>
    <text x="700" y="396" class="flows" text-anchor="middle">WAL stream</text>
    <path d="M612 410 H 780" stroke="#151515" stroke-width="2.5" fill="none"/>
    <polygon points="790,410 778,404 778,416" fill="#151515"/>
    <text x="700" y="428" class="flows" text-anchor="middle">replayed continuously</text>
  </g>

  <g id="flow-filestore" class="f">
    <text x="700" y="456" class="flow" text-anchor="middle">Filestore</text>
    <text x="700" y="470" class="flows" text-anchor="middle">rsync-tls</text>
    <path d="M612 484 H 780" stroke="#151515" stroke-width="2.5" fill="none" stroke-dasharray="9 4"/>
    <polygon points="790,484 778,478 778,490" fill="#151515"/>
    <text x="700" y="502" class="flows" text-anchor="middle">PVC to PVC</text>
    <text x="700" y="516" class="flows" text-anchor="middle">every 2 minutes</text>
  </g>

  <g id="flow-interconnect-link" class="f">
    <path d="M780 544 H 620" stroke="#ee0000" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
    <polygon points="612,544 622,539 622,549" fill="#ee0000"/>
    <text x="700" y="564" class="flows" text-anchor="middle">link established</text>
    <text x="700" y="578" class="flows" text-anchor="middle">outbound only</text>
  </g>

  <!-- ══════════════════════ PASSIVE CLUSTER ══════════════════════ -->

  <g id="passive-cluster" class="f">
    <rect x="790" y="250" width="560" height="475" rx="12" fill="#fafafa" stroke="#151515" stroke-width="2"/>
    <rect x="790" y="250" width="560" height="6" rx="3" fill="#0066cc"/>

    <text x="810" y="284" class="hdr">PASSIVE — OpenShift single node, AWS</text>
    <text x="810" y="303" class="hdrsub">Warm standby · also the ACM hub (Vault, policies, the link job)</text>

    <g id="passive-app">
      <rect x="810" y="314" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="810" y="314" width="4" height="58" rx="2" fill="#0066cc"/>
      <text x="828" y="337" class="ct">Odoo 19 CRM/ERP</text>
      <text x="828" y="356" class="cs">Scaled to zero · deployed, configured, and asleep</text>
    </g>

    <g id="passive-db">
      <rect x="810" y="381" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="810" y="381" width="4" height="58" rx="2" fill="#0066cc"/>
      <text x="828" y="404" class="ct">CloudNativePG (Postgres) — replica cluster</text>
      <text x="828" y="423" class="cs">Read-only, in recovery · seconds behind the primary</text>
    </g>

    <g id="passive-volsync">
      <rect x="810" y="448" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="810" y="448" width="4" height="58" rx="2" fill="#0066cc"/>
      <text x="828" y="471" class="ct">VolSync — ReplicationDestination</text>
      <text x="828" y="490" class="cs">Receives the filestore into its own PVC and snapshots each sync</text>
    </g>

    <g id="passive-rhsi">
      <rect x="810" y="515" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="810" y="515" width="4" height="58" rx="2" fill="#0066cc"/>
      <text x="828" y="538" class="ct">Red Hat Service Interconnect — Site + Listener + Link</text>
      <text x="828" y="557" class="cs">Dials out to the active site · the tunnel is established from here</text>
    </g>

    <g id="passive-pipelines">
      <rect x="810" y="582" width="520" height="58" rx="6" fill="#ffffff" stroke="#d2d2d2" stroke-width="1.2"/>
      <rect x="810" y="582" width="4" height="58" rx="2" fill="#0066cc"/>
      <text x="828" y="605" class="ct">OpenShift Pipelines — the failover run</text>
      <text x="828" y="624" class="cs">Guard GitOps → promote the database → restore the filestore → scale up → verify</text>
    </g>

    <g id="passive-oadp">
      <rect x="810" y="649" width="520" height="58" rx="6" fill="#ffffff" stroke="#b8bbbe" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text x="828" y="672" class="ct" fill="#4d4d4d">OADP (Velero) — optional</text>
      <text x="828" y="691" class="cs">Namespace restore for rebuild scenarios · not in the replication path</text>
    </g>
  </g>

  <!-- ══════════════════════ FOOTER: WHAT REPLICATES ══════════════════════ -->

  <g id="footer" class="f">
    <rect x="50" y="750" width="1300" height="78" rx="10" fill="#f5f5f5" stroke="#d2d2d2" stroke-width="1.2"/>

    <rect x="70" y="766" width="3" height="46" fill="#151515"/>
    <text x="86" y="782" class="footh">Structured state — the database</text>
    <text x="86" y="801" class="foot">CloudNativePG streams write-ahead log over the VAN. Synchronous in-cluster, asynchronous across regions.</text>

    <rect x="700" y="766" width="3" height="46" fill="#151515"/>
    <text x="716" y="782" class="footh">Unstructured state — the filestore</text>
    <text x="716" y="801" class="foot">VolSync copies the PVC directly to the passive PVC over rsync-tls. Nothing lands in an object store.</text>
  </g>

  <!-- ══════════════════════ LEGEND ══════════════════════ -->

  <g id="legend" class="f">
    <text x="50" y="866" class="kicker">LEGEND</text>

    <path d="M50 888 H 90" stroke="#0066cc" stroke-width="2.5" fill="none"/>
    <text x="100" y="892" class="lgd">User traffic</text>

    <path d="M200 888 H 240" stroke="#0066cc" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
    <text x="250" y="892" class="lgd">Standby path — idle until failover</text>

    <path d="M480 888 H 520" stroke="#151515" stroke-width="2.5" fill="none"/>
    <text x="530" y="892" class="lgd">Database replication</text>

    <path d="M700 888 H 740" stroke="#151515" stroke-width="2.5" fill="none" stroke-dasharray="9 4"/>
    <text x="750" y="892" class="lgd">Filestore replication</text>

    <path d="M930 888 H 970" stroke="#8a8d90" stroke-width="1.8" fill="none" stroke-dasharray="2 4"/>
    <text x="980" y="892" class="lgd">GitOps and policy — control plane, not data</text>

    <path d="M50 918 H 90" stroke="#ee0000" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
    <text x="100" y="922" class="lgd">Interconnect link — dialled outbound from the passive site</text>
  </g>

</g>
</svg>
