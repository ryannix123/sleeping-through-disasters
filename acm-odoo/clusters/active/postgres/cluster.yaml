---
# Active cluster: the PRIMARY CloudNativePG PostgreSQL cluster for Odoo.
# Source of truth. The passive cluster streams from it over the Skupper VAN.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: odoo-db
  namespace: odoo
  labels:
    app: odoo
    app.kubernetes.io/part-of: odoo-dr
    odoo.io/component: database
    odoo.io/role: primary
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6

  # SNO: single instance. A second Postgres pod can't schedule on one node
  # (default pod anti-affinity), so there is no in-cluster hot standby. DR
  # resilience comes from the cross-cluster replica on the passive site, not
  # from intra-cluster failover. This is the expected trade-off on single-node.
  instances: 1

  bootstrap:
    initdb:
      database: odoo
      owner: odoo

  storage:
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
    pg_hba:
      # Allow replication from the standby cluster across the Skupper VAN.
      - host replication streaming_replica all scram-sha-256

    # NOTE: No synchronous replication is configured. With a single instance
    # there is no local replica to acknowledge commits, so quorum-based
    # synchronous replication (method: any, number: 1) would pause ALL writes
    # under the default dataDurability: required — the database would never
    # accept writes and Odoo's first-boot init would hang. The cross-cluster
    # replica on the passive site is asynchronous by design (so a degraded WAN
    # link never halts writes on the active primary), which is exactly what we
    # want for this DR pattern.

  monitoring:
    enablePodMonitor: true
