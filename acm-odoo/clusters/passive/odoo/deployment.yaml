---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data
  namespace: odoo
  labels:
    app: odoo
    app.kubernetes.io/part-of: odoo-dr
    odoo.io/component: application
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  labels:
    app: odoo
    app.kubernetes.io/part-of: odoo-dr
    odoo.io/component: application
  annotations:
    app.openshift.io/custom-icon: "https://cdn.freebiesupply.com/logos/large/2x/odoo-logo-png-transparent.png"
spec:
  replicas: 0
  selector:
    matchLabels: { app: odoo }
  strategy: { type: Recreate }
  template:
    metadata:
      labels:
        app: odoo
        app.kubernetes.io/part-of: odoo-dr
        odoo.io/component: application
    spec:
      containers:
        - name: odoo
          image: quay.io/ryan_nix/odoo-openshift:19.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8069 }
            - { containerPort: 8072 }
          env:
            - { name: DB_HOST, value: odoo-db-rw }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME,     valueFrom: { secretKeyRef: { name: odoo-db-app, key: dbname } } }
            - { name: DB_USER,     valueFrom: { secretKeyRef: { name: odoo-db-app, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: odoo-db-app, key: password } } }
            - { name: ADMIN_PASSWORD,       valueFrom: { secretKeyRef: { name: odoo-admin, key: master-password } } }
            - { name: ADMIN_LOGIN_PASSWORD, valueFrom: { secretKeyRef: { name: odoo-admin, key: login-password } } }
            - { name: WITHOUT_DEMO, value: "all" }
            - { name: WORKERS, value: "0" }
            - name: WEB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: web_base_url
          readinessProbe:
            httpGet: { path: /web/health, port: 8069 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /web/health, port: 8069 }
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/odoo }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: odoo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: odoo
  labels:
    app: odoo
    app.kubernetes.io/part-of: odoo-dr
spec:
  selector: { app: odoo }
  ports:
    - { name: http,     port: 8069, targetPort: 8069 }
    - { name: longpoll, port: 8072, targetPort: 8072 }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: odoo
  namespace: odoo
  labels:
    app: odoo
    app.kubernetes.io/part-of: odoo-dr
  annotations:
    haproxy.router.openshift.io/timeout: "600s"
spec:
  to: { kind: Service, name: odoo }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
